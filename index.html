<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JsonLens — an IDE-style JSON editor and structural diff viewer that runs entirely in your browser."
    />
    <title>JsonLens — JSON editor &amp; diff</title>
    <style>
      /* Paint the app background before the bundle loads so there is no flash. */
      html {
        background: #14161a;
      }
      html[data-theme='light'] {
        background: #eff1f4;
      }
    </style>
    <script>
      // Apply the saved theme before first paint so light mode doesn't flash dark.
      try {
        var saved = JSON.parse(localStorage.getItem('jsonlens.session.v1') || 'null')
        if (saved && saved.settings && saved.settings.theme === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (error) {
        /* first visit, or storage blocked */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
